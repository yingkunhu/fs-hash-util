name: Build and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read version from source
        id: ver
        run: |
          VER=$(grep '^var version = ' main.go | sed 's/.*"\(.*\)".*/\1/')
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: CGO_ENABLED=0 go test ./...

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.version=${{ steps.ver.outputs.ver }}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/fshash-darwin-arm64  .
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/fshash-linux-amd64   .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/fshash-linux-arm64   .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum fshash-darwin-arm64 fshash-linux-amd64 fshash-linux-arm64 > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/fshash-darwin-arm64
            dist/fshash-linux-amd64
            dist/fshash-linux-arm64
            dist/checksums.txt

name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: CGO_ENABLED=0 go test ./...

      - name: Build binaries
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VER="${VERSION#v}"
          LDFLAGS="-s -w -X main.version=${VER}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/fshash-darwin-arm64  .
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/fshash-linux-amd64   .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/fshash-linux-arm64   .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum fshash-darwin-arm64 fshash-linux-amd64 fshash-linux-arm64 > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/fshash-darwin-arm64
            dist/fshash-linux-amd64
            dist/fshash-linux-arm64
            dist/checksums.txt
